<div class="pagehead">
  <p class="kicker">Add Repository</p>
  <h1 class="pagehead__title">添加 DustDrift</h1>
</div>

<section class="copybox">
  <p class="copybox__url">{{repo_url}}</p>
  <button class="btn btn--primary" type="button" data-copy="{{repo_url}}">复制地址</button>
</section>

<section class="addgrid">
  <div class="qrwrap">
    <img class="qr" src="{{root}}assets/repo-qr.png" alt="软件源地址二维码：{{repo_url}}" width="120" height="120">
    <p class="qrwrap__cap">相机扫码后选 Sileo 或 Irisin</p>
  </div>

  <ul class="clients">
    <li>
      <span class="clients__name">Sileo</span>
      <a class="btn btn--ghost btn--sm" href="sileo://source/{{repo_url}}">打开</a>
    </li>
    <li>
      <span class="clients__name">Irisin</span>
      <a class="btn btn--ghost btn--sm" href="irisin://repository/add?url={{repo_url}}">添加</a>
    </li>
    <li>
      <span class="clients__name">Zebra</span>
      <span class="clients__note">需手动粘贴（客户端未实现一键）</span>
    </li>
  </ul>
</section>

<details class="fold">
  <summary>手动添加步骤</summary>
  <ol class="steps">
    <li>打开客户端的「源」，点右上角 <b>+</b></li>
    <li>粘贴上面的地址并保存</li>
    <li>回到源列表下拉刷新，插件即出现</li>
  </ol>
</details>

<details class="fold">
  <summary>命令行方式</summary>
  <pre class="code">apt update
apt install &lt;包名&gt;</pre>
</details>

<p class="hint">Zebra 2 源码中的 <code>zbra://</code> 分支仍是 <code>// TODO</code>，因此不提供一键入口。</p>
