<nav class="crumb" aria-label="位置">
  <a href="{{root}}packages/">Packages</a><span aria-hidden="true">/</span><span>{{env}}</span>
</nav>

<header class="pkghead">
  <div class="pkghead__icon" aria-hidden="true">{{initial}}</div>
  <div class="pkghead__text">
    <h1 class="pkghead__name">{{name}}</h1>
    <p class="pkghead__id">{{package}}</p>
  </div>
  <span class="tag tag--{{tag_class}}">{{env}}</span>
</header>

<p class="pkghead__summary">{{summary}}</p>

<div class="acts">
  <a class="btn btn--primary btn--sm" href="sileo://package/{{package}}">用 Sileo 打开</a>
  <a class="btn btn--ghost btn--sm" href="irisin://package/{{package}}">用 Irisin 打开</a>
</div>
<p class="hint">需先添加本源，否则客户端会提示找不到该插件。</p>

<dl class="specs">
  <div><dt>版本</dt><dd>{{version}}</dd></div>
  <div><dt>架构</dt><dd>{{architecture}}</dd></div>
  <div><dt>大小</dt><dd>{{size_label}}</dd></div>
  <div><dt>分组</dt><dd>{{env}}</dd></div>
  {{maintainer}}
</dl>

<section class="block">
  <h2 class="block__title">描述</h2>
  <div class="prose">{{description}}</div>
</section>

{{depends}}

<section class="block">
  <h2 class="block__title">获取</h2>
  <div class="getrow">
    <a class="btn btn--ghost btn--sm" href="{{root}}{{filename}}" download>下载 .deb</a>
    <span class="mono">{{file_name}}</span>
  </div>
  <p class="mono-line">SHA256 <span class="mono">{{sha_short}}</span>
    <button class="mini" type="button" data-copy="{{sha256}}">复制</button>
  </p>
</section>

{{changelog}}
