<nav class="crumb" aria-label="位置">
  <a href="{{root}}browse/">软件包</a><span aria-hidden="true">/</span><span>{{section}}</span>
</nav>

<header class="pkg-head">
  <div class="pkg-head__mark" aria-hidden="true">{{initial}}</div>
  <div>
    <h1>{{name}}</h1>
    <p class="pkg-head__id">{{package}}</p>
  </div>
</header>

{{open_actions}}

<dl class="facts">
  <div><dt>版本</dt><dd>{{version}}</dd></div>
  <div><dt>架构</dt><dd>{{arch}}</dd></div>
  <div><dt>大小</dt><dd>{{size}}</dd></div>
  <div><dt>分组</dt><dd>{{section}}</dd></div>
  {{maintainer_fact}}
</dl>

<section class="block">
  <h2>描述</h2>
  <p class="prose">{{description}}</p>
</section>

{{depends_block}}

<section class="block">
  <h2>获取</h2>
  <p><a class="link" href="{{root}}{{filename}}" download>下载 .deb 文件</a></p>
  <p class="mono-note">{{file}}</p>
  <p class="mono-note">SHA256 <span class="mono">{{sha256_short}}</span> <button class="mini" type="button" data-copy="{{sha256}}" aria-label="复制完整 SHA256">复制</button></p>
</section>
