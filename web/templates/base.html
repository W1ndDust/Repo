<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0C0E12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{root}}favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<link rel="stylesheet" href="{{root}}assets/style.css?v={{asset_v}}">
</head>
<body data-page="{{page}}">
<a class="skip" href="#main">跳到主要内容</a>

<header class="nav">
  <div class="nav__in">
    <a class="brand" href="{{root}}" aria-label="DustDrift 首页">
      <img class="brand__mark" src="{{root}}favicon.png" alt="" width="26" height="26">
      <span class="brand__word">DustDrift</span>
    </a>
    <button class="nav__toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu">
      <span class="vh">菜单</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
    </button>
    <nav class="nav__menu" id="navMenu" aria-label="主导航">
      <a href="{{root}}"{{nav_home}}>Home</a>
      <a href="{{root}}packages/"{{nav_packages}}>Packages</a>
      <a href="{{root}}about/"{{nav_about}}>About</a>
      <a class="btn btn--sm btn--primary nav__cta" href="{{root}}add/">Add Repository</a>
    </nav>
  </div>
</header>

<main id="main">
{{body}}
</main>

<footer class="foot">
  <div class="foot__in">
    <div class="foot__brand">
      <img src="{{root}}favicon.png" alt="" width="22" height="22">
      <span>{{label}}</span>
    </div>
    <nav class="foot__links" aria-label="页脚导航">
      <a href="{{root}}packages/">Packages</a>
      <a href="{{root}}add/">Add Repository</a>
      <a href="{{root}}about/">About</a>
    </nav>
    <p class="foot__meta">{{package_count}} 个插件</p>
  </div>
</footer>

<script src="{{root}}assets/app.js?v={{asset_v}}" defer></script>
</body>
</html>
