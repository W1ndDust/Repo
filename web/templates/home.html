<section class="hero">
  <div class="hero__in">
    <div class="hero__lead">
      <p class="kicker">iOS 越狱插件源</p>
      <h1 class="hero__title">DustDrift</h1>
      <p class="hero__sub">{{package_count}} 个插件，按运行环境分组，装之前能看清依赖和校验值。</p>
      <div class="hero__acts">
        <a class="btn btn--primary" href="{{root}}add/">添加软件源</a>
        <a class="btn btn--ghost" href="{{root}}packages/">浏览插件</a>
      </div>
    </div>

    <aside class="rail" aria-label="插件索引">
      <p class="rail__head"><span>Index</span><span>{{package_count}} 项</span></p>
      <ol class="rail__list">
{{rail_items}}
      </ol>
    </aside>
  </div>
</section>

<section class="stats" aria-label="统计">
{{stats}}
</section>

<section class="band band--envs">
  <div class="band__in">
    <div class="band__head">
      <h2 class="band__title">按环境浏览</h2>
      <a class="more" href="{{root}}packages/">全部 {{package_count}} 个</a>
    </div>
    <div class="envs">
{{env_cards}}
    </div>
  </div>
</section>
