<div class="page-head">
  <h1>软件包</h1>
  <p class="page-head__meta" id="resultCount">{{package_count}} 个</p>
</div>

<div class="tools">
  <label class="search" for="q">
    <span class="search__icon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5 17 17"></path></svg></span>
    <input id="q" type="search" name="q" placeholder="搜索名称、标识符或描述" autocomplete="off" enterkeyhint="search">
    <button class="search__clear" type="button" hidden aria-label="清除搜索">✕</button>
  </label>

  <div class="seg" role="tablist" aria-label="按越狱环境筛选">
    <button role="tab" type="button" data-section="" aria-selected="true">全部</button>
{{seg_buttons}}
  </div>

  <label class="sort">
    <span>排序</span>
    <select id="sort">
      <option value="name">名称</option>
      <option value="version">版本</option>
    </select>
  </label>
</div>

<ul class="rows rows--full" id="list">
{{rows}}
</ul>

<div class="empty" id="empty" hidden>
  <p id="emptyText">没有匹配的软件包</p>
  <button class="btn btn--quiet" type="button" id="clearAll">清除筛选</button>
</div>

<div class="skeleton" id="skeleton" hidden aria-hidden="true">
  <div></div><div></div><div></div>
</div>
