name: 更新源索引

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'depictions/**'
      - 'scripts/**'
      - 'Release'
      - 'Packages'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Packages / Release
        run: python3 scripts/gen_index.py .

      - name: 提交索引
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          if git diff --cached --quiet; then
            echo "索引无变化"
          else
            git commit -m "chore: 重建源索引 [skip ci]"
            git push
          fi
