name: 构建站点

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'depictions/**'
      - 'Packages'
      - 'Release'
      - 'CydiaIcon.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成数据与页面
        run: |
          python3 web/build_data.py
          python3 web/build.py
          python3 web/build_depiction.py

      - name: 提交生成结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html packages add about assets data depictions
          if git diff --cached --quiet; then
            echo "页面无变化"
            exit 0
          fi
          git commit -m "chore: 重新生成站点 [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "推送被拒，拉取后重试（第 $i 次）"
            git -c pull.rebase=false pull --no-rebase origin main
          done
          exit 1
