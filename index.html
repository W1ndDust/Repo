<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DustDrift-Repo</title>
<style>
  :root{
    --bg:#0a0b10; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1);
    --txt:#eef1f7; --dim:#8b93a7; --accent:#5b8cff; --accent2:#a06bff;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f4f9; --card:rgba(255,255,255,.85); --line:rgba(10,15,30,.1);
      --txt:#0d1220; --dim:#5f6880;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:22px 16px 40px;background:var(--bg);color:var(--txt);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    max-width:720px;margin-inline:auto;
  }
  body::before{
    content:"";position:fixed;inset:-20% -20% auto;height:60vh;z-index:-1;
    background:radial-gradient(60% 60% at 30% 0%,rgba(91,140,255,.22),transparent 70%),
               radial-gradient(50% 50% at 85% 10%,rgba(160,107,255,.18),transparent 70%);
    pointer-events:none;
  }
  header{display:flex;gap:14px;align-items:center;margin-bottom:20px}
  .icon{
    width:62px;height:62px;border-radius:16px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:28px;
    box-shadow:0 8px 24px rgba(91,140,255,.35);
  }
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .urlbox{
    display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;
  }
  @media (prefers-color-scheme: light){ .urlbox{background:rgba(10,20,40,.05)} }
  .urlbox span{flex:1;color:var(--dim)}
  button{
    font:inherit;font-size:14px;font-weight:600;border:0;border-radius:11px;
    padding:10px 14px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 18px rgba(91,140,255,.28);
  }
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .btnrow button{flex:1;min-width:110px}
  h2{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px}
  .pkg{display:flex;gap:12px;align-items:flex-start}
  .pkg .ph{
    width:42px;height:42px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
    background:rgba(91,140,255,.16);color:var(--accent);font-size:18px;
  }
  .pkg .name{font-weight:620;font-size:15.5px}
  .pkg .meta{color:var(--dim);font-size:12px;margin-top:1px}
  .pkg .desc{color:var(--txt);opacity:.8;font-size:13.5px;margin-top:7px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:rgba(91,140,255,.16);color:var(--accent);margin-left:6px;vertical-align:1px}
  .empty{color:var(--dim);font-size:13.5px;text-align:center;padding:18px 0}
  .sechdr{
    display:flex;align-items:center;gap:9px;margin:20px 0 10px;
    font-size:13px;font-weight:650;letter-spacing:.02em;color:var(--txt);
  }
  .sechdr::before{content:"";width:3px;height:14px;border-radius:2px;
    background:linear-gradient(var(--accent),var(--accent2))}
  .sechdr .n{color:var(--dim);font-weight:500;font-size:12px}
  .sechdr .ln{flex:1;height:1px;background:var(--line)}
  ol,ul{margin:0;padding-left:20px;color:var(--dim);font-size:13.5px}
  li{margin:5px 0}
  code{font:12.5px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.16);padding:2px 6px;border-radius:6px;color:var(--txt)}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:28px;line-height:1.7}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#1b1f2b;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;
    opacity:0;pointer-events:none;transition:.25s;border:1px solid rgba(255,255,255,.12);z-index:9;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="icon" id="repoIcon">📦</div>
  <div>
    <h1 id="repoName">插件源</h1>
    <div class="sub" id="repoDesc">加载中…</div>
  </div>
</header>

<div class="card">
  <div class="urlbox"><span id="repoUrl">…</span></div>
  <div class="btnrow">
    <button onclick="copyUrl()">复制源地址</button>
    <button class="ghost" onclick="openSileo()">在 Sileo 打开</button>
  </div>
</div>

<h2>插件列表 <span id="count"></span></h2>
<div id="list"><div class="empty">读取中…</div></div>

<h2>如何添加</h2>
<div class="card">
  <ol>
    <li><b>Sileo</b>：点击上方「在 Sileo 打开」，或 源 → 右上角 + → 粘贴地址</li>
    <li><b>Irisin / Zebra</b>：源 → 添加 → 粘贴上面的地址</li>
    <li><b>越狱环境</b>：<code>apt update</code> 后 <code>apt install 包名</code></li>
  </ol>
</div>

<footer>
  由 Minis 生成 · 每次 push 后 GitHub Actions 自动重建索引<br>
  <span id="build"></span>
</footer>
<div class="toast" id="toast"></div>

<script>
const base = location.origin + location.pathname.replace(/index\.html$/, '');
document.getElementById('repoUrl').textContent = base;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function copyUrl(){
  const done = () => toast('已复制，去 Sileo 添加吧');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(base).then(done, fallback);
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = base; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast(base); }
    document.body.removeChild(ta);
  }
}
function openSileo(){ location.href = 'sileo://source/' + base.replace(/^https?:\/\//,''); }

function fmtSize(n){
  if (!n) return '';
  return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB';
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

fetch('packages.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    const repo = data.repo || {};
    if (repo.label) document.getElementById('repoName').textContent = repo.label;
    if (repo.description) document.getElementById('repoDesc').textContent = repo.description;
    const pkgs = data.packages || [];
    const sections = data.sections || [...new Set(pkgs.map(p => p.section))];
    document.getElementById('count').textContent = pkgs.length ? `(${pkgs.length})` : '';
    const list = document.getElementById('list');
    if (!pkgs.length){
      list.innerHTML = '<div class="card empty">源已就绪，还没有插件。<br>把 .deb 放进 <code>debs/</code> 再 push 即可。</div>';
      return;
    }
    const card = p => `
      <div class="card pkg">
        <div class="ph">${esc((p.name || '?')[0]).toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div class="name">${esc(p.name)}<span class="tag">v${esc(p.version)}</span></div>
          <div class="meta">${esc(p.package)} · ${esc(p.arch)} · ${fmtSize(p.size)}</div>
          ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
          ${p.author ? `<div class="meta" style="margin-top:6px">by ${esc(p.author)}</div>` : ''}
        </div>
      </div>`;
    const groups = sections
      .map(s => ({ name: s, pkgs: pkgs.filter(p => p.section === s) }))
      .filter(g => g.pkgs.length);
    list.innerHTML = groups.map(g => `
      <div class="sechdr">${esc(g.name)}<span class="n">${g.pkgs.length}</span><span class="ln"></span></div>
      ${g.pkgs.map(card).join('')}`).join('');
  })
  .catch(err => {
    document.getElementById('list').innerHTML =
      '<div class="card empty">还没有 packages.json，先运行<br><code>python3 scripts/gen_index.py</code></div>';
    console.warn(err);
  });
</script>
</body>
</html>
